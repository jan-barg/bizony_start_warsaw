<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Price gap from optimal by strategy</title>
<desc id="desc">Horizontal Tukey box plots compare legitimate purchase gaps. The boxes and whiskers use every purchase; twelve evenly spaced non-outlier observations provide sparse distribution context.</desc>
