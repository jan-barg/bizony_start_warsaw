[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealhunter"
version = "0.1.0"
description = "Deal Hunter — agentic deal-hunting over a seeded simulated market (implementation-spec.md v1.3)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
    "rapidfuzz>=3.6",
    "anthropic>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["dealhunter*"]

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
markers = [
    "integration: requires other branches merged; runs at sync points only",
]
