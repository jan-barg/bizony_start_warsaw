<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Purchase outcomes across 100 runs</title>
<desc id="desc">Stacked outcome bars show legitimate purchases, invalid purchases, and misses for SolidHunt and the casual shopper.</desc>
<rect width="1100" height="430" fill="#FFFFFF"/>
<rect width="1100" height="8" fill="#43F27E"/>
<style>text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#080808} .small{font-size:11px} .label{font-size:13px;font-weight:650} .title{font-size:24px;font-weight:750;letter-spacing:-.7px} .subtitle{font-size:12px;fill:#59615B} .metric{font-size:18px;font-weight:750;letter-spacing:-.3px}</style>
<g aria-label="SolidHunt" transform="translate(934 19)">
<rect width="28" height="28" fill="#43F27E"/>
<path d="M6 12V6H12 M16 6H22V12 M22 16V22H16 M12 22H6V16" fill="none" stroke="#080808" stroke-width="3"/>
<rect x="13" y="13" width="3" height="3" fill="#080808" transform="rotate(45 14.5 14.5)"/>
<text x="38" y="21" font-size="17" letter-spacing="-.7"><tspan font-weight="500">solid</tspan><tspan font-weight="750">hunt</tspan></text>
</g>
<text x="40" y="38" class="title">Did each strategy complete a legitimate purchase?</text>
<text x="242" y="145" text-anchor="end" class="label">SolidHunt improved monitor</text>
<rect x="260.0" y="115" width="600.4" height="52" fill="#43F27E"/>
<text x="560.2" y="147" text-anchor="middle" class="label" style="fill:#FFFFFF">79</text>
<rect x="860.4" y="115" width="0.0" height="52" fill="#C52A22"/>
<rect x="860.4" y="115" width="159.6" height="52" fill="#D8DDD9"/>
<text x="940.2" y="147" text-anchor="middle" class="label" style="fill:#080808">21</text>
<text x="1020" y="191" text-anchor="end" class="small">79 legitimate · 0 invalid · 21 missed</text>
<text x="242" y="265" text-anchor="end" class="label">Casual checkout shopper (3-day)</text>
<rect x="260.0" y="235" width="623.2" height="52" fill="#43F27E"/>
<text x="571.6" y="267" text-anchor="middle" class="label" style="fill:#FFFFFF">82</text>
<rect x="883.2" y="235" width="0.0" height="52" fill="#C52A22"/>
<rect x="883.2" y="235" width="136.8" height="52" fill="#D8DDD9"/>
<text x="951.6" y="267" text-anchor="middle" class="label" style="fill:#080808">18</text>
<text x="1020" y="311" text-anchor="end" class="small">82 legitimate · 0 invalid · 18 missed</text>
<rect x="260" y="365" width="14" height="14" fill="#43F27E"/>
<text x="282" y="377" class="small">Legitimate purchase</text>
<rect x="480" y="365" width="14" height="14" fill="#C52A22"/>
<text x="502" y="377" class="small">Invalid purchase</text>
<rect x="700" y="365" width="14" height="14" fill="#D8DDD9"/>
<text x="722" y="377" class="small">Miss</text>
</svg>
