<rect width="1100" height="430" fill="#FFFFFF"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#080808} .small{font-size:11px} .label{font-size:13px;font-weight:600} .title{font-size:22px;font-weight:700}</style>
<text x="40" y="38" class="title">Did each strategy complete a legitimate purchase?</text>
<text x="242" y="145" text-anchor="end" class="label">SolidHunt improved monitor</text>
<rect x="260.0" y="115" width="600.4" height="52" fill="#137A3D"/>
<text x="560.2" y="147" text-anchor="middle" class="label" style="fill:#FFFFFF">79</text>
<rect x="860.4" y="115" width="0.0" height="52" fill="#C52A22"/>
<rect x="860.4" y="115" width="159.6" height="52" fill="#D8DDD9"/>
<text x="940.2" y="147" text-anchor="middle" class="label" style="fill:#080808">21</text>
<text x="1020" y="191" text-anchor="end" class="small">79 legitimate · 0 invalid · 21 missed</text>
<text x="242" y="265" text-anchor="end" class="label">Casual checkout shopper (3-day)</text>
<rect x="260.0" y="235" width="623.2" height="52" fill="#137A3D"/>
<text x="571.6" y="267" text-anchor="middle" class="label" style="fill:#FFFFFF">82</text>
<rect x="883.2" y="235" width="0.0" height="52" fill="#C52A22"/>
<rect x="883.2" y="235" width="136.8" height="52" fill="#D8DDD9"/>
<text x="951.6" y="267" text-anchor="middle" class="label" style="fill:#080808">18</text>
<text x="1020" y="311" text-anchor="end" class="small">82 legitimate · 0 invalid · 18 missed</text>
<rect x="260" y="365" width="14" height="14" fill="#137A3D"/>
<text x="282" y="377" class="small">Legitimate purchase</text>
<rect x="480" y="365" width="14" height="14" fill="#C52A22"/>
<text x="502" y="377" class="small">Invalid purchase</text>
