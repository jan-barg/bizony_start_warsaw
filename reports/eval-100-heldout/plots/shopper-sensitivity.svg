<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
<title id="title">Held-out shopper sensitivity comparison</title>
<desc id="desc">Small multiples compare legitimate purchase rate, mean price gap, and cap violations for SolidHunt, an attentive three-day shopper, and a weekly shopper.</desc>
<rect width="1280" height="610" fill="#FFFFFF"/>
<style>text{font-family:Inter,Arial,sans-serif;fill:#080808} .small{font-size:11px} .label{font-size:13px;font-weight:600} .title{font-size:22px;font-weight:700}</style>
<text x="40" y="38" class="title">Held-out trade-off across attentive and weekly shoppers</text>
<text x="40" y="80" class="label">Legitimate purchase rate</text>
<text x="40" y="117" class="small">SolidHunt improved</text>
<rect x="40" y="130" width="390" height="34" fill="#F4F6F3"/>
<rect x="40" y="130" width="335.5" height="34" fill="#137A3D"/>
<text x="383.5" y="153" class="label">79%</text>
<text x="40" y="232" class="small">Shopper · every 3 days</text>
<rect x="40" y="245" width="390" height="34" fill="#F4F6F3"/>
<rect x="40" y="245" width="348.2" height="34" fill="#A76100"/>
<text x="396.2" y="268" class="label">82%</text>
<text x="40" y="347" class="small">Shopper · weekly</text>
<rect x="40" y="360" width="390" height="34" fill="#F4F6F3"/>
<rect x="40" y="360" width="297.3" height="34" fill="#D49A4A"/>
<text x="345.3" y="383" class="label">70%</text>
<text x="40" y="465" class="small">higher is better</text>
