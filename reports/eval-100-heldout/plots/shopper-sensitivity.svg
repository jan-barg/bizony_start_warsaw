<text x="450" y="117" class="small">SolidHunt improved</text>
<rect x="450" y="130" width="390" height="34" fill="#F4F6F3"/>
<rect x="450" y="130" width="164.4" height="34" fill="#137A3D"/>
<text x="622.4" y="153" class="label">€7.66</text>
<text x="450" y="232" class="small">Shopper · every 3 days</text>
<rect x="450" y="245" width="390" height="34" fill="#F4F6F3"/>
<rect x="450" y="245" width="296.4" height="34" fill="#A76100"/>
<text x="754.4" y="268" class="label">€13.80</text>
